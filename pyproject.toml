[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssoc-rational-core"
version = "0.1.0"
description = "A small, deterministic kernel for testing first-principle cognition hypotheses"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rational-core = "rational_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

